<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      患者データを端末外に出さない設計を設定ミスで壊せないよう、外部接続をCSPで禁じる。
      すべてのアセットはバンドルされるため self のみで足りる。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <!--
      検索結果に載せない（Phase 5 の実測検証が終わるまで）。

      臨床値を出すツールであり、検証中の版が院外の人の検索経路に乗るのは避けたい。
      GitHub Pages は応答ヘッダを足せないので `X-Robots-Tag` は使えず、robots.txt も
      効かない — クローラが読むのはドメイン直下の
      `https://yamaguchitoshi.github.io/robots.txt` であり、ここは別リポジトリ
      （ユーザーサイト）の持ち物で、本リポジトリから配信できるのは
      `/mnread/robots.txt` だけだからである。したがって meta で指示する。

      これは行儀のよいクローラへの**お願い**であって、閲覧の制限ではない。
      URL を知っていれば誰でも開ける。
      **Phase 5 の検証が完了し、公開してよいと判断した時点で外すこと。**
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>MNREAD-J / Jk 解析</title>
    <!--
      アイコンはデータURIで埋め込む。別ファイルにするとリクエストが1本増え、
      「外部への通信を持たない」という保証を目視で確かめにくくなる。
      図柄はチャートと同じく、大きい行から小さい行へ縮んでいく3本。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Cg fill='%23111111'%3E%3Crect x='6' y='7' width='20' height='5'/%3E%3Crect x='6' y='15' width='14' height='3.5'/%3E%3Crect x='6' y='21.5' width='9' height='2.5'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
