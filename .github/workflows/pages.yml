name: Deploy to GitHub Pages

# PLAN.md「GitHub Pages とブランチ構成」の差し替え手順 2。
# Pages のソースを試作の gh-pages ブランチから、main のビルドへ移す。
# URL（https://yamaguchitoshi.github.io/mnread/）は変えない。
#
# base は apps/web/vite.config.ts で /mnread/ に固定してある。ここを合わせないと
# アセットが 404 になる。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信中の版が中途半端に上書きされないよう、実行は直列にして途中打ち切りをしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 11 の対応は action-setup v6 から。版は package.json の
      # packageManager (pnpm@11.13.1) から取るので、ここでは指定しない。
      - uses: pnpm/action-setup@v6

      # cache: pnpm は明示指定なので v5 以降も従来どおり効く
      # （v5/v6 で変わったのは packageManager からの「自動」キャッシュの方）。
      # pnpm を先に入れておく必要があるため、action-setup より後に置く。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 壊れた計算を配信しないための門。臨床値を出すツールなので、
      # テストを通らないものは Pages に載せない。
      - name: 型チェック
        run: pnpm typecheck

      - name: ゴールデンデータの転記検証
        run: pnpm verify:fixtures

      - name: テスト
        run: pnpm test

      - name: ビルド
        run: pnpm --filter @mnread/web build

      - uses: actions/configure-pages@v6

      # v4 以降、ドット始まりのファイルは成果物に含まれない。apps/web/dist は
      # index.html と assets/ だけで、Pages を Actions から配信する構成では
      # .nojekyll も要らないため影響なし。public/ を足すときは注意。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # upload-pages-artifact と版を揃える（成果物の受け渡し形式が対）。
      - id: deployment
        uses: actions/deploy-pages@v5
